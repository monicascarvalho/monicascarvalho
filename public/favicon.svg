<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      :root {
        --bg-fill: #fff1f2;
        --border-stroke: #fecdd3;
        --grid-stroke: rgba(225, 29, 72, 0.15);
        --primary-stroke: #e11d48;
        --secondary-stroke: #be185d;
        --accent-fill: #e11d48;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-fill: #141214;
          --border-stroke: #4c1d2e;
          --grid-stroke: rgba(251, 113, 133, 0.18);
          --primary-stroke: #fb7185;
          --secondary-stroke: #fda4af;
          --accent-fill: #fb7185;
        }
      }
      .bg { fill: var(--bg-fill); stroke: var(--border-stroke); stroke-width: 1.5; }
      .grid { stroke: var(--grid-stroke); stroke-width: 0.8; stroke-dasharray: 2 2; }
      .arch-line { fill: none; stroke: var(--primary-stroke); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arch-sec { fill: none; stroke: var(--secondary-stroke); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: var(--accent-fill); }
    </style>
  </defs>

  <!-- Architectural Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" class="bg" />

  <!-- Drafting Guidelines / Technical Grid -->
  <line x1="12" y1="32" x2="52" y2="32" class="grid" />
  <line x1="32" y1="12" x2="32" y2="52" class="grid" />

  <!-- Monogram M: Structural Truss / Elevation -->
  <!-- Left Column -> Peak -> Center Valley -> Right Peak -> Right Column -->
  <path d="M 16 46 L 16 20 L 26 34 L 36 20 L 36 46" class="arch-line" />

  <!-- Monogram C: Curved Foundation / Cantilever sweep embracing the M -->
  <!-- Arc starting from top right, sweeping through the bottom base -->
  <path d="M 48 24 C 44 18 36 18 30 20 M 24 46 C 32 50 44 48 48 38" class="arch-sec" />

  <!-- Architectural Nodes / Precision Vertex Ticks -->
  <circle cx="16" cy="20" r="1.8" class="node" />
  <circle cx="36" cy="20" r="1.8" class="node" />
  <circle cx="26" cy="34" r="1.8" class="node" />
</svg>
